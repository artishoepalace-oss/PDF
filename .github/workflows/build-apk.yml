name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Maker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release v1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PDF-Maker-v1.0.0.apk
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 PDF-Maker-v1.0.0.apk --clobber
          else
            gh release create v1.0.0 PDF-Maker-v1.0.0.apk --target "$GITHUB_SHA" --title "PDF Maker v1.0.0" --notes "First Android release of PDF Maker. Includes Image to PDF, Smart Scan/camera capture, Import PDF, Compress PDF, PDF to JPG, Merge PDF, basic DOCX to PDF, file manager, sharing, sorting, delete actions and dark mode."
          fi
